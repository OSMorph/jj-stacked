run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    # Default linters (already enabled)
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    # Additional recommended linters
    - gofmt
    - goimports
    - misspell
    - unconvert
    - unparam
    - gocritic
    - revive
    - nolintlint
    - copyloopvar
    - bodyclose
    - exhaustive

linters-settings:
  goimports:
    local-prefixes: github.com/OSMorph/jj-stacked
  revive:
    rules:
      - name: blank-imports
      - name: context-as-argument
      - name: context-keys-type
      - name: error-return
      - name: error-strings
      - name: exported
      - name: increment-decrement
      - name: var-declaration
  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
  exhaustive:
    default-signifies-exhaustive: true

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    # Stuttering type names are intentional design choices in this codebase
    - linters:
        - revive
      text: "stutters"
    # Bubble Tea models require value receivers for the tea.Model interface
    - linters:
        - gocritic
      text: "hugeParam"
      path: "internal/ui/"
    # evalOrder suggestion in graph.go is a false positive for Bubble Tea patterns
    - linters:
        - gocritic
      text: "evalOrder"
      path: "internal/ui/graph.go"
