version: "2"
run:
  modules-download-mode: readonly
linters:
  enable:
    - bodyclose
    - copyloopvar
    - exhaustive
    - gocritic
    - misspell
    - nolintlint
    - revive
    - unconvert
    - unparam
  settings:
    exhaustive:
      default-signifies-exhaustive: true
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: error-return
        - name: error-strings
        - name: exported
        - name: increment-decrement
        - name: var-declaration
  exclusions:
    generated: lax
    rules:
      - linters: [revive]
        text: stutters
      - linters: [gocritic]
        path: internal/ui/
        text: hugeParam
      - linters: [gocritic]
        path: internal/ui/graph.go
        text: evalOrder
      - linters: [staticcheck]
        text: QF1012
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/OSMorph/jj-stacked
